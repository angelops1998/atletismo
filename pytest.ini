# Configuración de los tests.
#   .venv/bin/pytest            # todo
#   .venv/bin/pytest -q tests/test_cobranza.py
#
# `pythonpath = .` es lo que permite correr `pytest` a secas desde la raíz: sin
# esto solo funciona con `python -m pytest`, que agrega el directorio actual.
# La base de los tests es SQLite en memoria (ver tests/conftest.py): no hace falta
# Postgres ni el .env, y no hay forma de que toquen los datos del club.
[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # Ruido de dependencias, no del proyecto. El aviso de Pydantic sí es nuestro
    # (config.py usa `class Config`, deprecado en v2) y se deja a la vista.
    ignore::DeprecationWarning:starlette.*
    ignore:.*httpx.*:DeprecationWarning
