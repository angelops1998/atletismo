# nginx server block para la app de Atletismo.
# NO SE INSTALA TODAVÍA: por ahora la app se accede directo por
# http://IP_DEL_VPS:8003 (ver deploy/atletismo.service). Guardá este archivo
# para el día que tengas un dominio propio para el club.
#
# Es una web INDEPENDIENTE de los otros proyectos del VPS: comparten nginx e
# IP, pero cada dominio enruta a su propia app.
#
# Instalación (en el VPS, como root, cuando haya dominio):
#   1) Reemplazá TU_DOMINIO por el dominio real.
#   2) Cambiá --bind 0.0.0.0:8003 a --bind 127.0.0.1:8003 en
#      /etc/systemd/system/atletismo.service y sudo systemctl restart atletismo
#   3) sudo cp deploy/nginx-atletismo.conf /etc/nginx/sites-available/atletismo
#   4) sudo ln -s /etc/nginx/sites-available/atletismo /etc/nginx/sites-enabled/atletismo
#   5) sudo nginx -t   (verifica sintaxis)
#   6) sudo systemctl reload nginx
#   7) Emitir el certificado HTTPS (agrega el bloque 443 y el redirect automáticamente):
#        sudo certbot --nginx -d TU_DOMINIO -d www.TU_DOMINIO
#   8) En el .env de la app, poner HTTPS_ONLY=true y reiniciar el servicio.
#   9) sudo ufw delete allow 8003   (ya no hace falta exponer el puerto directo)
#
# NOTA: dejá este archivo con SOLO el bloque :80. certbot reescribe el resto.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # Archivos estáticos servidos directo por nginx (más rápido que pasar por la app).
    location /static/ {
        alias /opt/atletismo/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
